# geok: website cache map begin
# Only the public site's static assets get a freshness lifetime. Current asset
# names are not content hashes, so avoid immutable or year-long caching.
map $uri $geok_website_cache_expiry {
    default off;
    ~^/assets/.*\.(css|js|svg|png|jpg|jpeg|webp|avif|ico|woff|woff2|ttf|otf)$ 1h;
    ~^/(en/)?((services-lite|case-studies|blog|whitepaper)/)?(index\.html)?$ -1;
    ~^/(en/)?blog/shanghai-local-geo/(index\.html)?$ -1;
    /robots.txt -1;
    /sitemap.xml -1;
}
# geok: website cache map end
