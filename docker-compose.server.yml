services:
  agent-browser-base:
    profiles: ["build"]
    build:
      context: .
      dockerfile: ./apps/agent/Dockerfile.browser-server
      args:
        PNPM_VERSION: "${PNPM_VERSION:-10.16.0}"
        CAMOUFOX_PIP_SPEC: "${CAMOUFOX_PIP_SPEC:-cloverlabs-camoufox[geoip]}"
        CAMOUFOX_BROWSER_CHANNEL: "${CAMOUFOX_BROWSER_CHANNEL:-official/stable}"
    image: ${ONEGLANSE_AGENT_BROWSER_IMAGE:-oneglanse-agent-browser:local}

  agent-worker:
    build:
      dockerfile: ./apps/agent/Dockerfile.server
      args:
        ONEGLANSE_AGENT_BROWSER_IMAGE: "${ONEGLANSE_AGENT_BROWSER_IMAGE:-oneglanse-agent-browser:local}"

  # Shares agent-worker's image, so it must share the server Dockerfile too.
  analysis-worker:
    build:
      dockerfile: ./apps/agent/Dockerfile.server
      args:
        ONEGLANSE_AGENT_BROWSER_IMAGE: "${ONEGLANSE_AGENT_BROWSER_IMAGE:-oneglanse-agent-browser:local}"

  db:
    build:
      dockerfile: ./packages/db/Dockerfile.server

  web:
    build:
      dockerfile: ./apps/web/Dockerfile.server
      args:
        NEXT_PUBLIC_ONEGLANSE_APP_MODE: self-host

  migrate:
    build:
      dockerfile: ./apps/web/Dockerfile.server
      args:
        NEXT_PUBLIC_ONEGLANSE_APP_MODE: self-host
