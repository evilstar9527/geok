name: oneglanse-app

# Docker's default json-file driver never rotates, so a long-lived worker
# (the agent logs heavily) eventually fills the host disk. Cap every service
# at 3 x 10 MB per container; `docker logs` still shows recent output.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------
  # Agent Worker
  # ----------------------------
  agent-worker:
    build:
      context: .
      dockerfile: ./apps/agent/Dockerfile
      args:
        PNPM_VERSION: "${PNPM_VERSION:-10.16.0}"
        CAMOUFOX_PIP_SPEC: "${CAMOUFOX_PIP_SPEC:-cloverlabs-camoufox[geoip]}"
        CAMOUFOX_BROWSER_CHANNEL: "${CAMOUFOX_BROWSER_CHANNEL:-official/stable}"
    image: ${ONEGLANSE_AGENT_IMAGE:-ghcr.io/evilstar9527/oneglanse-agent:latest}
    container_name: oneglanse-agent-worker
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 16m
    shm_size: "2gb"
    env_file:
      - .env
    environment:
      AGENT_AUTH_ROOT_DIR: /storage/auth
      AGENT_ARTIFACT_ROOT_DIR: /storage/artifacts
      PROVIDER_EXECUTION_CONCURRENCY: "2"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-oneglanse}
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_HOST: redis
    volumes:
      - ${ONEGLANSE_STORAGE_ROOT:-/opt/oneglanse/storage}:/storage
    ports:
      - "3333:3333"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - data
      - backend
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 12G
        reservations:
          cpus: '2'
          memory: 2G
    # Two things must hold for this worker to be useful: the auth API on :3333 has
    # to answer (it is how provider sessions reach the worker) and Redis has to be
    # reachable (it is the BullMQ backend). Probing Redis alone — as this did
    # originally — reported healthy while the API server was wedged, so a broken
    # worker stayed in rotation. `retryStrategy: null` stops ioredis from
    # reconnecting forever, which is what keeps a dead Redis a fast failure
    # instead of a probe that runs into the 10s timeout.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const Redis=require('ioredis');const r=new Redis({host:'redis',password:process.env.REDIS_PASSWORD||'redis',lazyConnect:true,retryStrategy:()=>null});Promise.all([fetch('http://127.0.0.1:3333/health').then(x=>{if(!x.ok)throw new Error('health '+x.status)}),r.ping()]).then(()=>{r.disconnect();process.exit(0)}).catch(e=>{console.error(String(e));r.disconnect();process.exit(1)})",
        ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ----------------------------
  # Analysis Worker
  # ----------------------------
  # Runs brand analysis for stored responses. It shares the agent image but never
  # launches a browser, so it stays small and can be restarted (or OOM-killed)
  # without touching a running collection.
  analysis-worker:
    # Same image as agent-worker, declared with the same build so a stack that
    # builds from source (rather than pulling) has the image before this service
    # needs it. Compose builds the shared tag once.
    build:
      context: .
      dockerfile: ./apps/agent/Dockerfile
      args:
        PNPM_VERSION: "${PNPM_VERSION:-10.16.0}"
        CAMOUFOX_PIP_SPEC: "${CAMOUFOX_PIP_SPEC:-cloverlabs-camoufox[geoip]}"
        CAMOUFOX_BROWSER_CHANNEL: "${CAMOUFOX_BROWSER_CHANNEL:-official/stable}"
    image: ${ONEGLANSE_AGENT_IMAGE:-ghcr.io/evilstar9527/oneglanse-agent:latest}
    container_name: oneglanse-analysis-worker
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "dist/analysis-worker.js"]
    stop_grace_period: 6m
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-oneglanse}
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      agent-worker:
        condition: service_started
    networks:
      - data
      - backend
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ----------------------------
  # Redis
  # ----------------------------
  redis:
    image: redis:7-alpine
    # maxmemory keeps Redis below the 512M container cap so it fails with an OOM
    # *command error* instead of being SIGKILLed by the kernel (which loses the
    # whole dataset). noeviction is deliberate: evicting keys under an LRU policy
    # corrupts BullMQ state — queue entries survive while the job hashes they
    # point at disappear, so jobs fail with "missing key" errors. Better to
    # refuse new writes loudly than to silently drop queued work.
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --maxmemory 384mb --maxmemory-policy noeviction
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-redis}\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  # ----------------------------
  # PostgreSQL (OFFICIAL IMAGE)
  # ----------------------------
  db:
    build:
      context: .
      dockerfile: ./packages/db/Dockerfile
    image: ${ONEGLANSE_POSTGRES_IMAGE:-ghcr.io/evilstar9527/oneglanse-postgres:latest}
    container_name: postgres_db
    restart: always
    logging: *default-logging
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB:-oneglanse}
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./packages/db/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-oneglanse}"]
      interval: 5s
      timeout: 5s
      retries: 5
      # 首次启动要跑 initdb + CREATE DATABASE + 装 pg_cron/http/pgcrypto 扩展,
      # 结尾的 shutdown checkpoint 在慢盘上 fsync 可能要数秒。5s×5=25s 不够,
      # 会在数据库其实正常的情况下报 "container postgres_db is unhealthy"。
      # start_period 内的失败不计入 retries,所以这只影响首启,不会延后就绪判定。
      start_period: 60s

  # ----------------------------
  # ClickHouse
  # ----------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_db
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./packages/db/clickhouse-init:/docker-entrypoint-initdb.d
      - ./packages/db/clickhouse-config/listen-ipv4.xml:/etc/clickhouse-server/config.d/zz-listen-ipv4.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Probe over HTTP (8123) rather than clickhouse-client: the client uses a
    # local connection and stays green even when the TCP listeners failed to
    # bind, which previously let a fully unreachable server report healthy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8123/ping' | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------
  # Web App (Next.js / UI)
  # ----------------------------
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        PNPM_VERSION: "${PNPM_VERSION:-10.16.0}"
    image: ${ONEGLANSE_WEB_IMAGE:-ghcr.io/evilstar9527/oneglanse-web:latest}
    container_name: oneglanse-web
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      AGENT_AUTH_ROOT_DIR: /storage/auth
      AGENT_ARTIFACT_ROOT_DIR: /storage/artifacts
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-oneglanse}
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_HOST: redis
    volumes:
      - ${ONEGLANSE_STORAGE_ROOT:-/opt/oneglanse/storage}:/storage:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - edge
      - frontend
      - backend
      - data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    # /api/health probes Postgres, Redis and ClickHouse and returns 503 when any
    # of them is unreachable, so this reports "can this container actually serve
    # traffic" rather than merely "did the process start". It is polled through
    # node instead of curl/wget because the standalone Next image ships node but
    # no HTTP client.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------
  # Database Migrations (ONE-SHOT)
  # ----------------------------
  migrate:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        PNPM_VERSION: "${PNPM_VERSION:-10.16.0}"
    image: ${ONEGLANSE_WEB_IMAGE:-ghcr.io/evilstar9527/oneglanse-web:latest}
    container_name: oneglanse-migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-oneglanse}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *default-logging
    working_dir: /workspace
    networks:
      - data
    command: pnpm --filter @oneglanse/db db:migrate

# ----------------------------
# Volumes
# ----------------------------
volumes:
  db_data:
  clickhouse_data:
  redis_data:

networks:
  edge:
    external: true
    name: oneglanse-edge
  frontend:
    driver: bridge
  backend:
    driver: bridge
  data:
    driver: bridge
