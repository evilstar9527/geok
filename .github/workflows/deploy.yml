name: Deploy

# Every push to main ships to production. The VPS pulls that same commit and
# rebuilds from source (see scripts/deploy-server.sh), so this job only has to
# trigger that script over SSH — it never transfers code itself.
#
# Deliberately NOT gated on the Build workflow: Build is currently red on every
# run (pre-existing lint errors, see the validate job), so gating would mean
# nothing ever deploys. Once Build is green, adding
# `workflow_run: {workflows: [Build], types: [completed]}` plus a
# `github.event.workflow_run.conclusion == 'success'` guard is the safer shape.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy main or inspect the website edge without changing it
        type: choice
        default: deploy
        options:
          - deploy
          - inspect-website-edge

# The deploy script runs `docker compose up -d --build`. Two runs at once would
# race on container names, so queue them — but never cancel: interrupting a
# deploy mid-build can leave the stack half-recreated.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Ship to production ───────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # The source build plus the health-check wait runs 10-25 minutes.
    timeout-minutes: 40
    steps:
      - name: Install deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # The keepalive settings matter: the server-side build takes 10-25 minutes
      # and a dropped connection would abandon the run without its exit status,
      # turning a successful deploy into a red X.
      - name: Run deploy script over SSH
        if: inputs.operation != 'inspect-website-edge'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            "root@$DEPLOY_HOST" \
            'cd /opt/geok && bash scripts/deploy-server.sh'

      - name: Inspect website edge routing (read only)
        if: inputs.operation == 'inspect-website-edge'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "root@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          docker ps --format '{{.Names}} {{.Image}}'
          while read -r container; do
            docker inspect --format '{{json .Mounts}}' "$container"
            docker exec "$container" nginx -T 2>&1 | awk '
              /^# configuration file/ || /^[ \t]*(listen|server_name|root|include|return|ssl_certificate|ssl_certificate_key)[ \t]/ { print }
            '
          done < <(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /nginx/ {print $1}')
          REMOTE
